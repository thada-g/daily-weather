name: Daily Weather

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get rain forecast
        run: |
          FORECAST=$(curl -s "https://wttr.in/Reading?format=j1")
          MAXTEMP=$(echo "$FORECAST" | grep -o '"maxtempC":"[0-9]*"' | head -1 | cut -d'"' -f4)
          MINTEMP=$(echo "$FORECAST" | grep -o '"mintempC":"[0-9]*"' | head -1 | cut -d'"' -f4)
          if echo "$FORECAST" | grep -q '"chanceofrain":"100"'; then
            MESSAGE="☔ It is likely to rain in Tilehurst today.
            🌡 High: ${MAXTEMP}°C
            🌡 Low: ${MINTEMP}°C" then
            MESSAGE="🌦 Rain is possible in Tilehurst today.
            🌡 High: ${MAXTEMP}°C
            🌡 Low: ${MINTEMP}°C"
          else
            MESSAGE="☀️ It is unlikely to rain in Tilehurst today.
            🌡 High: ${MAXTEMP}°C
            🌡 Low: ${MINTEMP}°C"
          fi

          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV

      - name: Send Telegram message
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"
